<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>LastHeard</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/icon.svg" alt="" width="28" height="28" />
        <h1>LastHeard</h1>
        <span id="status" class="status" title="Poll status">●</span>
      </div>
      <div class="controls">
        <input id="filter" type="search" placeholder="Filter: area, callsign, repeater…" autocomplete="off" />
        <button id="alarm-toggle" class="toggle off" title="Enable alarm sound (click to enable audio)">🔇 Sound off</button>
      </div>
    </header>

    <section class="alarm-panel" id="alarm-panel">
      <div class="alarm-head">Alarms — alert me when these callsigns come on air</div>
      <form id="watch-form" class="watch-form">
        <input id="watch-input" placeholder="Add callsign to watch…" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <ul id="watch-list" class="watch-list"></ul>
    </section>

    <main>
      <div id="list" class="list"></div>
      <p id="empty" class="empty" hidden>No stations heard in the last 10 minutes.</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
